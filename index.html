<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planet Creaator </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars"></div>
    <header class="header">
        <h1> PLANET CREATOR </h1>
        <p> Build a world tat exists nowhere else!!</p>
    </header>
    <main class="main">
        <section class="controls">
            <h2>controls</h2>
            <div class="option">
                <label>Planet Type</label>
                <div class="button-row"id="typeButtons">
                    <button class="type-btn active" data-type="earth">Earth</button>
                    <button class="type-btn" data-type="lava">Lava</button>
                    <button class="type-btn" data-type="ice">Ice</button>
                    <button class="type-btn" data-type="desert">Desert</button>
                    <button class="type-btn" data-type="alien">Alien</button>
                </div>
            </div>
            <div class="option">
                <label>Planet Size</label>
                <input type="range" id="sizeSlider" min="100" max="260" value="180">
            </div>
            <div class="option">
                <label>Rings</label>
                <div class="button-row">
                    <button class="ring-btn active" data-rings="on">ON</button>
                    <button class="ring-btn" data-rings="off">OFF</button>
                </div>
            </div>
            <div class="option">
                <label>Moons</label>
                <div class="button-row" id="moonButtons">
                    <button class="moon-btn active" data-moons="0">0</button>
                    <button class="moon-btn" data-moons="1">1</button>
                    <button class="moon-btn" data-moons="2">2</button>
                    <button class="moon-btn" data-moons="3">3</button>
                </div>
            </div>
        </section>
        <section class="space">
            <div class="ring" id="ring"></div>
            <div class="planet earth" id="planet"></div>
            <div class="moons" id="moons"></div>
        </section>
        <section class="info">
            <h2>Planet Profile</h2>
        </section>
    </main>
<script src="script.js"></script>
</body>
</html>
